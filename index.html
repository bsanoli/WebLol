<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL — Worlds e Campeonato</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#182033;--line:#263049;--txt:#e6e9f0;--mut:#8b94a8;--gold:#c8a85a;--red:#e0605a;--green:#4cc38a;--blue:#3d8bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:700}
button.dng{border-color:#5a2a2a;color:#ff9a94}
button:disabled{opacity:.5;cursor:default}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input:focus{outline:none;border-color:var(--gold)}
#top{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:linear-gradient(90deg,#1a1408,#121826 40%);border-bottom:2px solid var(--gold)}
#top .logo{font-weight:800;color:var(--gold);letter-spacing:1px;margin-right:10px;white-space:nowrap}
#top .tab{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);background:none;border:none;border-bottom:3px solid transparent;border-radius:0;height:52px;padding:0 16px}
#top .tab:hover{color:var(--txt)}
#top .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
#top .tab[data-t=admin]{display:none}
body.isadmin #top .tab[data-t=admin]{display:block}
.sp{flex:1}
.chip{font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip.ok{border-color:#2b5a40;color:#8fe0b4}.chip.warn{border-color:#6a5420;color:#f0d38a}.chip.bad{border-color:#6a2a2a;color:#ff9a94}
#send{font-size:12px;padding:5px 12px}
#user{font-size:12px;font-weight:700}
#user small{color:var(--gold);font-weight:800}
.view{display:none;border:0;width:100%;height:calc(100% - 52px);background:var(--bg)}
.view.on{display:block}
#v-admin{overflow:auto;padding:18px}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .hd b{font-size:15px}
.mut{color:var(--mut);font-size:12px}
.chg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.chg input{width:auto;margin-top:3px}
.op{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.op.add{background:#1f4a33;color:#8fe0b4}.op.edit{background:#4a3d1a;color:#f0d38a}.op.del{background:#4a1f1f;color:#ff9a94}
.det{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.5}
.det b{color:var(--txt);font-weight:600}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{color:var(--mut);font-size:11px;text-transform:uppercase}
.ok{color:var(--green)}.bad{color:var(--red)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:24px;width:min(460px,100%);box-shadow:0 10px 40px #000}
#mbox h3{margin:0 0 6px;color:var(--gold);font-size:20px}
#mbox p{color:var(--mut);margin:6px 0 14px;font-size:13px;line-height:1.5}
#mbox .err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
#mbox .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.rid{display:flex;align-items:center;gap:6px}.rid span{font-size:22px;font-weight:800;color:var(--gold)}.rid #rtag{width:110px;flex:none;text-transform:uppercase}
.fpath{background:var(--bg);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:15px;margin:4px 0 10px}
#mbox label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:800px){#top .logo,#user{display:none}#top .tab{padding:0 8px;font-size:12px}}
</style>
</head>
<body>
<div id="top">
  <span class="logo">⚔ LoL</span>
  <button class="tab" data-t="worlds">Worlds</button>
  <button class="tab" data-t="camp">Campeonato</button>
  <button class="tab" data-t="admin">Administração</button>
  <div class="sp"></div>
  <span id="sync" class="chip">…</span>
  <button id="send" style="display:none"></button>
  <span id="user"></span>
  <button id="logout" title="Sair / trocar usuário" style="font-size:12px;padding:4px 8px">Sair</button>
</div>
<iframe id="v-worlds" class="view" title="Worlds 2026"></iframe>
<iframe id="v-camp" class="view" title="Campeonato"></iframe>
<div id="v-admin" class="view"><div class="wrap" id="admin"></div></div>
<div id="modal"><div id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>

/* ===== IndexedDB (guarda a pasta escolhida e as chaves do admin neste PC) ===== */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("lol-time",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbOp=(mode,fn)=>idb.then(db=>new Promise((res,rej)=>{const tx=db.transaction("kv",mode),st=tx.objectStore("kv"),rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)}));
const idbGet=k=>idbOp("readonly",s=>s.get(k)).catch(()=>null);
const idbSet=(k,v)=>idbOp("readwrite",s=>s.put(v,k));
const idbDel=k=>idbOp("readwrite",s=>s.delete(k));

/* ================= criptografia (Web Crypto do navegador) ================= */
const TE=new TextEncoder(),TD=new TextDecoder(),C=crypto.subtle;
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const RSA_GEN={name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},RSA_IMP={name:"RSA-OAEP",hash:"SHA-256"};
const ECD={name:"ECDSA",namedCurve:"P-256"},ECS={name:"ECDSA",hash:"SHA-256"};
async function pwKey(pw,salt){const b=await C.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);return C.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function aesEnc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await C.encrypt({name:"AES-GCM",iv},key,bytes))}}
const aesDec=(key,o)=>C.decrypt({name:"AES-GCM",iv:ub64(o.iv)},key,ub64(o.ct));
async function fingerprint(admin){const h=await C.digest("SHA-256",TE.encode(admin.encPub.n+admin.sigPub.x+admin.sigPub.y));return[...new Uint8Array(h)].slice(0,8).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function createAdmin(pw){
  const ek=await C.generateKey(RSA_GEN,true,["encrypt","decrypt"]),sk=await C.generateKey(ECD,true,["sign","verify"]);
  const salt=crypto.getRandomValues(new Uint8Array(16)),k=await pwKey(pw,salt);
  return{id:"brunoltz#LTZ",created:Date.now(),salt:b64(salt),encPub:await C.exportKey("jwk",ek.publicKey),sigPub:await C.exportKey("jwk",sk.publicKey),
    encPriv:await aesEnc(k,await C.exportKey("pkcs8",ek.privateKey)),sigPriv:await aesEnc(k,await C.exportKey("pkcs8",sk.privateKey))};
}
async function unlockAdmin(admin,pw){ // lança erro se a senha estiver errada
  const k=await pwKey(pw,ub64(admin.salt));
  const encPriv=await C.importKey("pkcs8",await aesDec(k,admin.encPriv),RSA_IMP,false,["decrypt"]);
  const sigPriv=await C.importKey("pkcs8",await aesDec(k,admin.sigPriv),ECD,false,["sign"]);
  const keys={encPriv,sigPriv,fp:await fingerprint(admin)};await idbSet("adminKeys",keys);return keys;
}
async function seal(admin,obj){ // criptografa para o admin (só a chave privada dele abre)
  const pub=await C.importKey("jwk",admin.encPub,RSA_IMP,false,["encrypt"]);
  const ak=await C.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
  const body=await aesEnc(ak,TE.encode(JSON.stringify(obj)));
  return{fmt:"lol-time-enc",v:1,wk:b64(await C.encrypt({name:"RSA-OAEP"},pub,await C.exportKey("raw",ak))),...body};
}
async function unseal(keys,o){const raw=await C.decrypt({name:"RSA-OAEP"},keys.encPriv,ub64(o.wk));const ak=await C.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return JSON.parse(TD.decode(await aesDec(ak,o)))}
async function signObj(keys,obj){const body=JSON.stringify(obj);return{body,sig:b64(await C.sign(ECS,keys.sigPriv,TE.encode(body)))}}
async function verifyObj(admin,o){try{const pub=await C.importKey("jwk",admin.sigPub,ECD,false,["verify"]);return await C.verify(ECS,pub,ub64(o.sig),TE.encode(o.body))?JSON.parse(o.body):null}catch(e){return null}}

/* ================= pasta do time (File System Access API) ================= */
let ROOT=null,ADMIN=null,KEYS=null,OFF=null; // OFF = versão oficial {version,at,data,log}
async function dirAt(path,create){let d=ROOT;for(const p of path)d=await d.getDirectoryHandle(p,{create});return d}
async function readJSON(path){try{const d=await dirAt(path.slice(0,-1),false);return JSON.parse(await (await (await d.getFileHandle(path.at(-1))).getFile()).text())}catch(e){return null}}
async function writeJSON(path,obj){const d=await dirAt(path.slice(0,-1),true);const fh=await d.getFileHandle(path.at(-1),{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(obj));await w.close()}
async function listDir(path){try{const d=await dirAt(path,false),out=[];for await(const[n,h]of d.entries())out.push([n,h]);return out}catch(e){return[]}}
async function removeFile(path){try{const d=await dirAt(path.slice(0,-1),false);await d.removeEntry(path.at(-1))}catch(e){}}
async function pickFolder(){
  if(!window.showDirectoryPicker){alert("Este navegador não permite escolher pasta. Use o Google Chrome ou o Microsoft Edge.");return false}
  try{ROOT=await showDirectoryPicker({id:"lol-time",mode:"readwrite"});await idbSet("root",ROOT);return true}catch(e){return false}
}

/* ================= dados: diferenças e versões ================= */
const shared=S=>({comps:clone(S?.comps||[]),plays:clone(S?.plays||[])});
const normItem=(kind,it)=>{const o={...it};if(kind==="comp")delete o.updated;else delete o.live;return JSON.stringify(o)};
function hsh(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function diff(local,base){
  const ch=[];
  for(const kind of["comp","play"]){const k=kind+"s",L=local[k]||[],B=base[k]||[],bm=new Map(B.map(x=>[x.id,x])),lm=new Map(L.map(x=>[x.id,x]));
    for(const x of L){const b=bm.get(x.id);if(!b)ch.push({kind,op:"add",id:x.id,after:x});else if(normItem(kind,x)!==normItem(kind,b))ch.push({kind,op:"edit",id:x.id,before:b,after:x})}
    for(const b of B)if(!lm.has(b.id))ch.push({kind,op:"del",id:b.id,before:b})}
  ch.forEach(c=>c.h=hsh(c.op+c.id+(c.after?normItem(c.kind,c.after):"")));
  return ch;
}
function applyChanges(data,changes){
  const out={comps:clone(data.comps||[]),plays:clone(data.plays||[])};
  for(const c of changes){const arr=out[c.kind+"s"],i=arr.findIndex(x=>x.id===c.id);
    if(c.op==="del"){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=clone(c.after);else arr.unshift(clone(c.after))}
  return out;
}
const itemName=c=>(c.after||c.before||{}).name||"(sem nome)";
const KN={comp:"Comp",play:"Jogada"},OPN={add:"nova",edit:"alterada",del:"apagada"};
function describe(c){ // resumo legível do que mudou
  if(c.op!=="edit")return c.kind==="comp"&&c.after?`Campeões: ${Object.entries(c.after.lanes||{}).map(([l,a])=>a.length?`<b>${l.toUpperCase()}</b> ${esc(a.join(", "))}`:"").filter(Boolean).join(" · ")||"nenhum"}`:c.kind==="play"&&c.after?`${c.after.steps?.length||0} passos`:"";
  const a=c.after,b=c.before,out=[];
  if(a.name!==b.name)out.push(`Nome: <b>${esc(b.name)}</b> → <b>${esc(a.name)}</b>`);
  if(c.kind==="comp"){
    for(const l of Object.keys({...a.lanes,...b.lanes})){const A=a.lanes?.[l]||[],B=b.lanes?.[l]||[];const add=A.filter(x=>!B.includes(x)),rem=B.filter(x=>!A.includes(x));
      if(add.length||rem.length)out.push(`<b>${l.toUpperCase()}</b>: ${add.length?"+ "+esc(add.join(", ")):""}${add.length&&rem.length?" · ":""}${rem.length?"− "+esc(rem.join(", ")):""}`);
      else if(A.join()!==B.join())out.push(`<b>${l.toUpperCase()}</b>: ordem de prioridade mudou (${esc(A.join(" > "))})`)}
    if((a.notes||"")!==(b.notes||""))out.push("Anotações alteradas");
    if(JSON.stringify(a.laneNotes||{})!==JSON.stringify(b.laneNotes||{}))out.push("Obs. das lanes alteradas");
    if(JSON.stringify(a.draft||{})!==JSON.stringify(b.draft||{}))out.push("Ordem do draft alterada");
  }else{if((a.steps||[]).length!==(b.steps||[]).length)out.push(`Passos: ${(b.steps||[]).length} → ${(a.steps||[]).length}`);else out.push("Posições/passos alterados");
    if(a.cb!==b.cb||a.cr!==b.cr)out.push("Comps das bolinhas alteradas")}
  return out.join("<br>");
}
const user=()=>lsGet(UKEY);
const local=()=>lsGet(KEY);
function pending(){const b=lsGet(BKEY);if(!b)return[];return diff(shared(local()),b.data)}
function isSampleOnly(S){return!S||(S.comps||[]).length<=1&&(!S.comps?.length||/do comps\.xlsx/.test(S.comps[0].name))&&!(S.plays||[]).some(p=>p.steps?.length)}

/* ================= sincronização ================= */
let reloadCamp=()=>{};
async function readOfficial(){
  ADMIN=await readJSON(["oficial","admin.json"]);if(!ADMIN)return{err:"noadmin"};
  const fp=await fingerprint(ADMIN),pin=lsGet(FPKEY);
  if(ADMIN_FP&&fp!==ADMIN_FP){ADMIN=null;return{err:"fp"}}
  if(pin&&pin!==fp)return{err:"fp"};lsSet(FPKEY,fp);
  const raw=await readJSON(["oficial","dados.json"]);if(!raw)return{err:"nodata"};
  const d=await verifyObj(ADMIN,raw);if(!d)return{err:"sig"};
  return{off:d};
}
async function sync(opts={}){
  if(!ROOT)return setSync("Sem pasta do time","warn");
  const r=await readOfficial();
  BADROOT=r.err==="noadmin";
  if(r.err){const m={noadmin:"⚠ Pasta errada: clique e escolha a pasta Usuarios",nodata:"Sem versão oficial ainda",fp:"⚠ Chave do admin mudou! Não sincronizado",sig:"⚠ Versão oficial com assinatura inválida"}[r.err];setSync(m,r.err==="fp"||r.err==="sig"||r.err==="noadmin"?"bad":"warn");if(r.err==="noadmin")updateStatus();return}
  OFF=r.off;const base=lsGet(BKEY),S=local()||{};
  let changed=false,notes=[];
  if(!base){
    const keep=isSampleOnly(S)?[]:diff(shared(S),OFF.data).filter(c=>c.op==="add");
    write(applyChanges(OFF.data,keep));changed=true;
  }else if(base.version!==OFF.version){
    const me=normId(user()?.id||""),rej=new Set(OFF.log.filter(l=>l.status==="rejected"&&normId(l.from)===me).map(l=>l.h));
    const mine=diff(shared(S),base.data).filter(c=>{if(rej.has(c.h)){notes.push(`${KN[c.kind]} "${itemName(c)}" foi recusada pelo admin`);return false}return true});
    write(applyChanges(OFF.data,mine));changed=true;
  }
  function write(data){const S2=local()||{};const live=new Map((S2.plays||[]).map(p=>[p.id,p.live]));
    S2.comps=data.comps;S2.plays=data.plays.map(p=>live.has(p.id)?{...p,live:live.get(p.id)}:p);
    if(!S2.comps.some(c=>c.id===S2.cur))S2.cur=S2.comps[0]?.id;if(!S2.plays.some(p=>p.id===S2.curPlay))S2.curPlay=S2.plays[0]?.id;
    lsSet(KEY,S2);lsSet(BKEY,{version:OFF.version,data:OFF.data});}
  if(changed&&opts.reload!==false)reloadCamp();
  notes.forEach(n=>toast(n,5000));
  updateStatus();
}
function setSync(t,c){$("#sync").textContent=t;$("#sync").className="chip "+(c||"")}
function updateStatus(){
  const u=user();$("#user").innerHTML=u?`${esc(u.id)}${u.admin?" <small>ADMIN</small>":""}`:"";
  document.body.classList.toggle("isadmin",!!u?.admin);
  if(!ROOT){setSync(u?"Pasta do time não conectada":"…","warn");$("#sync").onclick=connectFolder;$("#sync").style.cursor="pointer";$("#send").style.display="none";return}
  $("#sync").onclick=BADROOT?repick:()=>sync().then(()=>toast("Sincronizado"));$("#sync").style.cursor="pointer";
  if(BADROOT){setSync("⚠ Pasta errada: clique e escolha a pasta Usuarios","bad");$("#send").style.display="none";return}
  if(OFF)setSync(`☁ Versão oficial v${OFF.version}`,"ok");
  const p=pending(),sent=new Set(lsGet(SKEY,[])),uns=p.filter(c=>!sent.has(c.h)),wait=p.length-uns.length;
  const b=$("#send");
  if(u?.admin){b.style.display=p.length?"":"none";b.className="pri";b.textContent=`Publicar minhas alterações (${p.length})`;b.onclick=()=>publish(p.map(c=>({...c,sid:"admin",from:u.id})),[],"Alterações do admin")}
  else{b.style.display=p.length?"":"none";b.className=uns.length?"pri":"";b.textContent=uns.length?`Enviar para aprovação (${uns.length})`:`⏳ ${wait} aguardando o admin`;b.disabled=!uns.length;b.onclick=sendChanges}
}
async function sendChanges(){
  const u=user(),base=lsGet(BKEY);if(!ROOT||!ADMIN||!base)return toast("Conecte a pasta do time primeiro");
  const sent=lsGet(SKEY,[]),ch=pending().filter(c=>!sent.includes(c.h));if(!ch.length)return;
  const sub={id:uid(),from:u.id,at:Date.now(),baseVersion:base.version,changes:ch};
  try{await writeJSON(["usuarios",safeName(u.id),"envios",sub.id+".lolenc"],await seal(ADMIN,sub));
    lsSet(SKEY,[...sent,...ch.map(c=>c.h)].slice(-500));toast(`${ch.length} alteração(ões) enviada(s) para o admin aprovar`);backupNow()}
  catch(e){toast("Não consegui gravar na pasta do time: "+e.message)}
  updateStatus();
}
let tBk;function scheduleBackup(){clearTimeout(tBk);tBk=setTimeout(backupNow,8000)}
async function backupNow(){const u=user();if(!ROOT||!ADMIN||!u)return;try{await writeJSON(["usuarios",safeName(u.id),"backup.lolenc"],await seal(ADMIN,{user:u.id,at:Date.now(),data:local()}))}catch(e){}}
addEventListener("storage",e=>{if(e.key===KEY){updateStatus();scheduleBackup()}});

/* ================= admin: publicar / aprovar ================= */
async function publish(approved,rejected,label){
  if(!KEYS)return toast("Desbloqueie o admin primeiro");
  const r=await readOfficial();if(r.err&&r.err!=="nodata")return toast("Erro lendo a versão oficial: "+r.err);
  const cur=r.off||{version:0,data:{comps:[],plays:[]},log:[]};
  const v=cur.version+1,at=Date.now();
  const log=[...cur.log,...approved.map(c=>({v,at,sid:c.sid,from:c.from,kind:c.kind,op:c.op,id:c.id,name:itemName(c),h:c.h,status:"approved"})),...rejected.map(c=>({v,at,sid:c.sid,from:c.from,kind:c.kind,op:c.op,id:c.id,name:itemName(c),h:c.h,status:"rejected"}))];
  const off={version:v,at,label,data:applyChanges(cur.data,approved),log};
  await writeJSON(["oficial","dados.json"],await signObj(KEYS,off));
  await writeJSON(["oficial","versoes","v"+off.version+".json"],await signObj(KEYS,off));
  await sync();renderAdmin();toast(`Versão oficial v${off.version} publicada`);
}

/* ================= tela de login / primeiro acesso ================= */
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.add("on");const i=$("#mbox input");i&&setTimeout(()=>i.focus(),50)}

const merr=m=>{const e=$("#mbox .err");if(e)e.textContent=m};
let pendingId=null;
function stepId(){
  modal(`<h3>Bem-vindo ao painel do time</h3><p>Entre com o seu nome de usuário do LoL (Riot ID). Você só precisa fazer isso uma vez neste PC.</p>
   <label>Riot ID</label>
   <div class="rid"><input id="rname" placeholder="Nome (ex: brunoltz)" maxlength="16" autocomplete="off" spellcheck="false"><span>#</span><input id="rtag" placeholder="TAG" maxlength="5" autocomplete="off" spellcheck="false"></div>
   <div class="err"></div>
   <div class="row"><button class="pri" id="ok">Continuar</button></div>`);
  const nm=$("#rname"),tg=$("#rtag");
  const go=()=>{const n=nm.value.trim(),tag=tg.value.replace(/[#\s]/g,"").toUpperCase();
    if(n.length<3)return merr("Digite o nome (mínimo 3 letras)."),nm.focus();
    if(!/^[A-Za-z0-9]{2,5}$/.test(tag))return merr("Digite a TAG depois do # (2 a 5 letras ou números)."),tg.focus();
    pendingId=n+"#"+tag;ROOT?afterFolder():stepFolder()};
  // se a pessoa digitar ou colar "nome#TAG" no primeiro campo, separa sozinho
  nm.addEventListener("input",()=>{if(nm.value.includes("#")){const[a,...r]=nm.value.split("#");nm.value=a.trim();tg.value=(r.join("")+tg.value).replace(/\s/g,"").slice(0,5);tg.focus()}});
  tg.addEventListener("input",()=>{const p=tg.selectionStart;tg.value=tg.value.replace(/[#\s]/g,"").toUpperCase();tg.setSelectionRange(p,p)});
  nm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();tg.focus()}});
  tg.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go()}if(e.key==="Backspace"&&!tg.value)nm.focus()});

const FOLDER="Usuarios";

   <p>Na próxima janela, selecione a pasta compartilhada do time no <b>OneDrive</b>: é a pasta <b>${FOLDER}</b>, a mesma onde está este arquivo HTML.</p>

async function repick(){closeModal();if(!await pickFolder())return updateStatus();if(!await validRoot())return wrongFolder();if(user()?.admin&&!KEYS)KEYS=await idbGet("adminKeys");BADROOT=false;await sync();renderAdmin();toast("Pasta do time conectada")}

      ADMIN=await createAdmin(a);await writeJSON(["oficial","admin.json"],ADMIN);KEYS=await unlockAdmin(ADMIN,a);lsSet(FPKEY,await fingerprint(ADMIN));

async function finishLogin(admin){

/* ================= aba Administração ================= */
async function renderAdmin(){
  const el=$("#admin");if(!user()?.admin)return;
  if(!ROOT||!ADMIN){el.innerHTML=`<h2>Administração</h2><div class="card">Conecte a pasta do time para ver os envios. <button class="pri" id="cf">Conectar pasta</button></div>`;$("#cf").onclick=connectFolder;return}
  if(!KEYS){el.innerHTML=`<h2>Administração</h2><div class="card"><p>Digite a senha de admin para desbloquear neste PC.</p><input type="password" id="apw" style="max-width:300px"> <button class="pri" id="aok">Desbloquear</button> <span class="bad" id="aerr"></span></div>`;
    $("#aok").onclick=async()=>{try{KEYS=await unlockAdmin(ADMIN,$("#apw").value);renderAdmin()}catch(e){$("#aerr").textContent="Senha incorreta"}};return}
  el.innerHTML=`<h2>Administração</h2><p class="mut">Carregando envios...</p>`;
  const done=new Set((OFF?.log||[]).map(l=>l.sid)),subs=[],users=[];
  for(const[uname,uh]of await listDir(["usuarios"])){if(uh.kind!=="directory")continue;
    let bk=null;try{bk=(await (await uh.getFileHandle("backup.lolenc")).getFile()).lastModified}catch(e){}
    users.push({uname,bk});
    for(const[fn,fh]of await listDir(["usuarios",uname,"envios"])){if(!fn.endsWith(".lolenc"))continue;
      try{const s=await unseal(KEYS,JSON.parse(await (await fh.getFile()).text()));s.file=["usuarios",uname,"envios",fn];if(done.has(s.id)){await removeFile(s.file);continue}subs.push(s)}catch(e){subs.push({id:fn,from:uname,err:true,file:["usuarios",uname,"envios",fn]})}}}
  subs.sort((a,b)=>(a.at||0)-(b.at||0));
  const mine=pending();
  el.innerHTML=`<h2>Envios aguardando aprovação (${subs.length})</h2>
   ${subs.length?subs.map((s,si)=>s.err?`<div class="card"><span class="bad">Não consegui abrir o envio ${esc(s.id)} de ${esc(s.from)} (arquivo corrompido ou de outra chave).</span> <button data-delf="${si}" class="dng">Apagar arquivo</button></div>`:`
    <div class="card"><div class="hd"><b>${esc(s.from)}</b><span class="mut">${fmtD(s.at)} · baseado na v${s.baseVersion}${OFF&&s.baseVersion<OFF.version?` <span style="color:var(--gold)">(versão oficial agora é v${OFF.version})</span>`:""}</span></div>
     ${s.changes.map((c,ci)=>`<label class="chg"><input type="checkbox" data-s="${si}" data-c="${ci}" checked><div><span class="op ${c.op}">${OPN[c.op]}</span> ${KN[c.kind]} <b>${esc(itemName(c))}</b><div class="det">${describe(c)}</div></div></label>`).join("")}
     <div class="btns"><button class="pri" data-ap="${si}">✓ Aprovar marcadas</button><button class="dng" data-rj="${si}">✕ Recusar tudo</button></div></div>`).join(""):`<div class="card mut">Nenhum envio pendente. 🎉</div>`}
   <h2>Minhas alterações (admin)</h2>
   <div class="card">${mine.length?mine.map(c=>`<div class="chg"><div><span class="op ${c.op}">${OPN[c.op]}</span> ${KN[c.kind]} <b>${esc(itemName(c))}</b><div class="det">${describe(c)}</div></div></div>`).join("")+`<div class="btns"><button class="pri" id="pubmine">Publicar como nova versão</button></div>`:'<span class="mut">Você não tem alterações locais além da versão oficial.</span>'}</div>
   <h2>Histórico (versão oficial v${OFF?.version||"-"})</h2>
   <div class="card"><table><tr><th>Versão</th><th>Data</th><th>De</th><th>O quê</th><th>Status</th></tr>
    ${(OFF?.log||[]).slice().reverse().slice(0,150).map(l=>`<tr><td>v${l.v}</td><td>${fmtD(l.at)}</td><td>${esc(l.from)}</td><td><span class="op ${l.op}">${OPN[l.op]}</span> ${KN[l.kind]} ${esc(l.name)}</td><td class="${l.status==="approved"?"ok":"bad"}">${l.status==="approved"?"aprovada":"recusada"}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">Ainda sem histórico.</td></tr>'}</table></div>
   <h2>Usuários</h2>
   <div class="card"><table><tr><th>Pasta</th><th>Última cópia (backup)</th><th></th></tr>
    ${users.map((u,i)=>`<tr><td>${esc(u.uname)}</td><td>${u.bk?fmtD(u.bk):'<span class="mut">—</span>'}</td><td>${u.bk?`<button data-bk="${i}">Baixar backup</button>`:""}</td></tr>`).join("")||'<tr><td colspan="3" class="mut">Nenhum usuário ainda.</td></tr>'}</table></div>
   <h2>Este PC</h2><div class="card"><span class="mut">Chave do admin: ${esc(KEYS.fp)}</span> <button id="lock">Bloquear admin neste PC</button> <button id="refresh">Atualizar</button></div>`;
  const pick=si=>{const s=subs[si],ap=[],rj=[];document.querySelectorAll(`[data-s="${si}"]`).forEach(cb=>{const c={...s.changes[+cb.dataset.c],sid:s.id,from:s.from};(cb.checked?ap:rj).push(c)});return{s,ap,rj}};
  el.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{const{s,ap,rj}=pick(+b.dataset.ap);b.disabled=true;await publish(ap,rj,`Envio de ${s.from}`);await removeFile(s.file);renderAdmin()});
  el.querySelectorAll("[data-rj]").forEach(b=>b.onclick=async()=>{const s=subs[+b.dataset.rj];if(!confirm(`Recusar todas as alterações de ${s.from}?`))return;b.disabled=true;await publish([],s.changes.map(c=>({...c,sid:s.id,from:s.from})),`Envio de ${s.from} recusado`);await removeFile(s.file);renderAdmin()});

  el.querySelectorAll("[data-bk]").forEach(b=>b.onclick=async()=>{const u=users[+b.dataset.bk];const d=await unseal(KEYS,await readJSON(["usuarios",u.uname,"backup.lolenc"]));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({comps:d.data.comps,plays:d.data.plays},null,2)],{type:"application/json"}));a.download=`backup-${u.uname}.json`;a.click()});
  const pm=$("#pubmine");if(pm)pm.onclick=()=>publish(mine.map(c=>({...c,sid:"admin",from:user().id})),[],"Alterações do admin");
  $("#lock").onclick=async()=>{await idbDel("adminKeys");KEYS=null;renderAdmin()};
  $("#refresh").onclick=async()=>{await sync();renderAdmin()};
}

var ROOT_PENDING;
