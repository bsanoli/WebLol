# Coleta diária das partidas de SoloQ dos pros (aba SoloQ do WebLol).
# Precisa do segredo RIOT_API_KEY (Settings › Secrets and variables › Actions).
# A lista de pros fica em scripts/soloq-pros.json.
# A coleta só commita src/data/soloq/. O site é gerado e publicado pelo deploy.yml (ADR 0003).
name: Coleta SoloQ

on:
  schedule:
    - cron: "0 9 * * *" # 6h em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soloq
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      alterou: ${{ steps.publicar.outputs.alterou }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar partidas na API da Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SOLOQ_MINUTES: "110"
        run: python3 -u scripts/soloq.py
      - name: Commitar os dados
        id: publicar
        run: |
          cp -r src/data/soloq "$RUNNER_TEMP/soloq"
          git config user.name "weblol-soloq[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Outras pessoas também publicam na main: refaz o commit sobre a versão mais recente.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf src/data/soloq && cp -r "$RUNNER_TEMP/soloq" src/data/soloq
            git add -A src/data/soloq
            if git diff --cached --quiet; then echo "alterou=false" >> "$GITHUB_OUTPUT"; echo "Nada novo"; exit 0; fi
            git commit -m "Atualiza partidas da SoloQ dos pros"
            if git push origin HEAD:main; then echo "alterou=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          exit 1

  # O push feito com o token do Actions não dispara outros workflows, então o deploy é chamado aqui.
  deploy:
    needs: coleta
    if: needs.coleta.outputs.alterou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
